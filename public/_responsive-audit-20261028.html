<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Zapla responsive audit — isolated diagnostic</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ebef;color:#182331;font:14px system-ui}header{padding:12px;background:white;position:sticky;top:0;z-index:99;border-bottom:1px solid #bcc4cc}select,button{font:inherit;padding:8px;margin:3px;border:1px solid #bbc4ce;background:white;border-radius:6px}button{cursor:pointer}#status{padding:8px}#frames{display:flex;align-items:flex-start;gap:12px;padding:12px;min-height:350px}.device{background:white;border:1px solid #aab4c0;border-radius:8px;padding:8px;flex:none}.device h2{font-size:12px;margin:0 0 8px}.device .viewport{overflow:hidden;position:relative}.device iframe{border:0;position:absolute;left:0;top:0;transform-origin:top left;background:white}.device pre{font-size:10px;white-space:pre-wrap;max-height:180px;overflow:auto}body.focused #frames{display:block}body.focused .device{display:none}body.focused .device.focus{display:block;width:fit-content}#results{margin:12px;background:white;padding:12px}#results table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;border-bottom:1px solid #ddd;padding:7px}#json{white-space:pre-wrap;max-height:450px;overflow:auto;font-size:10px}#summary{padding:6px}.warn{color:#9b2816}
</style>
<header>
 <strong>Read-only layout audit</strong>
 <select id="page" aria-label="Page"></select><button id="previous">Previous page</button><button id="next">Next page</button>
 <select id="focus" aria-label="Focus viewport"><option value="all">All viewports</option><option value="desktop">Desktop 1440 × 900</option><option value="ipad">iPad portrait 834 × 1112</option><option value="landscape">iPad landscape 1194 × 834</option><option value="phone">Phone 393 × 852</option></select>
 <button id="top">Top</button><button id="section">Next section</button><button id="middle">Middle</button><button id="footer">Footer</button><button id="measure">Measure</button><button id="sweep">Scan all 40 pages</button><button id="download">Download results</button>
 <button id="narrow">Use 320px phone</button><div id="status">Source: ebac159b85ffc697bc29872817f9235671ce180a. No application files changed.</div>
</header>
<main><div id="frames"></div><div id="results"><div id="summary"></div><table><thead><tr><th>Route</th><th>Desktop</th><th>iPad portrait</th><th>iPad landscape</th><th>Phone</th></tr></thead><tbody id="rows"></tbody></table><pre id="json"></pre></div></main>
<script>
const paths=['/','/platform','/crm','/customer-marketing','/follow-up','/ai-receptionist','/quote-follow-up','/reactivation','/reviews','/booking','/pricing-v2','/Pricing-v3','/features/ai-chatbot','/features/unified-inbox','/features/business-phone','/features/pipeline-management','/features/automation-builder','/features/calendars-bookings','/features/quotes-invoices-signatures','/features/websites-funnels-forms','/industries','/industries/allied-health','/industries/cosmetic-skin-clinics','/industries/dental','/industries/mechanics','/industries/mortgage-brokers','/industries/trades','/comparison','/comparison/review','/comparison/zapla-vs-activecampaign','/comparison/zapla-vs-creatio','/comparison/zapla-vs-ghl','/comparison/zapla-vs-hubspot','/comparison/zapla-vs-keap','/comparison/zapla-vs-monday-crm','/comparison/zapla-vs-pipedrive','/comparison/zapla-vs-podium','/comparison/zapla-vs-salesforce','/comparison/zapla-vs-thryv','/comparison/zapla-vs-zoho'];
const sizes=[{id:'desktop',w:1440,h:900},{id:'ipad',w:834,h:1112},{id:'landscape',w:1194,h:834},{id:'phone',w:393,h:852}];
const $=s=>document.querySelector(s),delay=n=>new Promise(r=>setTimeout(r,n));
let scans=[],busy=false;
for(const path of paths){const o=document.createElement('option');o.value=o.textContent=path;$('#page').append(o)}
const devices=sizes.map(size=>{const card=document.createElement('section');card.className='device';card.id=size.id;card.innerHTML=`<h2>${size.id} · ${size.w} × ${size.h}</h2><div class="viewport"><iframe title="${size.id} page" width="${size.w}" height="${size.h}"></iframe></div><pre class="metrics"></pre>`;$('#frames').append(card);return {...size,card,frame:card.querySelector('iframe'),metrics:card.querySelector('.metrics')}});
function layout(){const focus=$('#focus').value;document.body.classList.toggle('focused',focus!=='all');for(const d of devices){d.card.classList.toggle('focus',d.id===focus);const scale=focus==='all'?Math.min(.31,(innerWidth-85)/3861):Math.min(1,(innerWidth-45)/d.w);d.frame.style.transform=`scale(${scale})`;const v=d.card.querySelector('.viewport');v.style.width=d.w*scale+'px';v.style.height=d.h*scale+'px';d.card.style.width=d.w*scale+18+'px'}}
addEventListener('resize',layout);$('#focus').onchange=layout;
async function load(path){$('#page').value=path;$('#status').textContent=`Loading ${path}`;await Promise.all(devices.map(d=>new Promise(resolve=>{let timer;d.frame.onload=async()=>{clearTimeout(timer);try{await Promise.race([d.frame.contentDocument.fonts.ready,delay(2500)]);}catch{}resolve()};timer=setTimeout(resolve,18000);d.frame.src=path})));await delay(350);measure();$('#status').textContent=`Ready: ${path}`}
function metric(d){try{const doc=d.frame.contentDocument,w=d.frame.contentWindow,root=doc.documentElement,body=doc.body,width=root.clientWidth;const all=[...body.querySelectorAll('*')];const visible=e=>{const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&+s.opacity!==0&&!e.closest('[aria-hidden="true"],[hidden]')};const text=e=>(e.innerText||'').replace(/\s+/g,' ').trim().slice(0,140);const selector=e=>e.tagName.toLowerCase()+(e.className&&typeof e.className==='string'?'.'+e.className.trim().split(/\s+/).slice(0,3).join('.'):'');const rect=e=>{const r=e.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y+w.scrollY),w:Math.round(r.width),h:Math.round(r.height)}};const outside=all.filter(e=>visible(e)&&!['SCRIPT','STYLE','SVG','PATH'].includes(e.tagName)&&e.getBoundingClientRect().right>width+2).filter(e=>e.children.length<5).slice(0,30).map(e=>({el:selector(e),text:text(e),...rect(e)}));const clipped=all.filter(e=>visible(e)&&e.childNodes.length&&[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())).filter(e=>{const s=w.getComputedStyle(e);return((e.scrollWidth>e.clientWidth+3&&['hidden','clip'].includes(s.overflowX))||(e.scrollHeight>e.clientHeight+3&&['hidden','clip'].includes(s.overflowY)))&&s.textOverflow!=='ellipsis'&&s.webkitLineClamp==='none'}).slice(0,25).map(e=>({el:selector(e),text:text(e),...rect(e)}));const headings=[...body.querySelectorAll('h1,h2')].filter(visible).map(e=>({text:text(e),font:w.getComputedStyle(e).fontSize,...rect(e)}));const scrolls=all.filter(e=>visible(e)&&e.scrollWidth>e.clientWidth+8&&['auto','scroll'].includes(w.getComputedStyle(e).overflowX)).slice(0,10).map(e=>({el:selector(e),text:text(e),width:e.clientWidth,scrollWidth:e.scrollWidth,...rect(e)}));const tiny=all.filter(e=>visible(e)&&e.children.length===0&&e.textContent.trim().length>6&&parseFloat(w.getComputedStyle(e).fontSize)<11).slice(0,20).map(e=>({el:selector(e),text:text(e),font:w.getComputedStyle(e).fontSize,...rect(e)}));return{device:d.id,viewport:[w.innerWidth,w.innerHeight],clientWidth:width,scrollWidth:root.scrollWidth,height:root.scrollHeight,pageOverflow:root.scrollWidth-width,scrollY:Math.round(w.scrollY),h1:headings.filter(h=>h.font&&h.text).slice(0,2),headings,outside,clipped,scrolls,tiny,brokenImages:[...doc.images].filter(i=>i.complete&&i.naturalWidth===0&&i.src).map(i=>({alt:i.alt,src:i.getAttribute('src')})),bodyError:/This page didn't load|Page not found/.test(body.innerText),embeddedFrames:[...doc.querySelectorAll('iframe')].map(f=>({title:f.title,src:f.getAttribute('src'),...rect(f)}))}}catch(e){return{device:d.id,error:String(e)}}}
function measure(){const data=devices.map(metric);for(let i=0;i<data.length;i++){const m=data[i];devices[i].metrics.textContent=JSON.stringify({overflow:m.pageOverflow,height:m.height,clipped:m.clipped?.length,tiny:m.tiny?.length,broken:m.brokenImages?.length,error:m.error||m.bodyError},null,1)}return data}
function scroll(mode){for(const d of devices){try{const w=d.frame.contentWindow,doc=d.frame.contentDocument;if(mode==='top')w.scrollTo(0,0);else if(mode==='footer')doc.querySelector('footer')?.scrollIntoView();else if(mode==='middle')w.scrollTo(0,(doc.documentElement.scrollHeight-d.h)/2);else {const next=[...doc.querySelectorAll('main h2,section h2')].map(e=>e.getBoundingClientRect().top+w.scrollY).find(y=>y>w.scrollY+100);w.scrollTo(0,next?next-80:doc.documentElement.scrollHeight)}}catch{}}setTimeout(measure,350)}
for(const action of ['top','section','middle','footer'])$('#'+action).onclick=()=>scroll(action);
$('#narrow').onclick=()=>{const d=devices.find(x=>x.id==='phone');d.w=d.w===393?320:393;d.h=d.w===320?740:852;d.frame.width=d.w;d.frame.height=d.h;d.card.querySelector('h2').textContent=`phone · ${d.w} × ${d.h}`;$('#narrow').textContent=d.w===320?'Use 393px phone':'Use 320px phone';layout();setTimeout(measure,350)};
$('#measure').onclick=measure;$('#page').onchange=()=>load($('#page').value);$('#next').onclick=()=>load(paths[(paths.indexOf($('#page').value)+1)%paths.length]);$('#previous').onclick=()=>load(paths[(paths.indexOf($('#page').value)+paths.length-1)%paths.length]);
function render(){const rows=$('#rows');rows.innerHTML='';for(const scan of scans){const tr=document.createElement('tr');const name=document.createElement('td');name.textContent=scan.path;tr.append(name);for(const m of scan.devices){const td=document.createElement('td');td.textContent=m.error?'ERROR':`overflow ${m.pageOverflow}px · ${m.height}px high · ${m.clipped?.length||0} clipped · ${m.brokenImages?.length||0} broken`;if(m.pageOverflow>2||m.error||m.bodyError||m.brokenImages?.length)td.className='warn';tr.append(td)}rows.append(tr)}$('#summary').textContent=`${scans.length} / ${paths.length} pages checked at ${sizes.length} viewport sizes.`;$('#json').textContent=JSON.stringify(scans,null,2)}
$('#sweep').onclick=async()=>{if(busy)return;busy=true;scans=[];for(const path of paths){await load(path);const stages=[measure()];for(const mode of ['middle','footer']){scroll(mode);await delay(450);stages.push(measure())}const data=stages[0].map((m,i)=>({...m,brokenImages:stages.flatMap(s=>s[i].brokenImages||[]).filter((x,j,a)=>a.findIndex(y=>y.src===x.src)===j),clipped:stages.flatMap(s=>s[i].clipped||[]).filter((x,j,a)=>a.findIndex(y=>y.el===x.el&&y.text===x.text)===j)}));scans.push({path,devices:data});render();$('#status').textContent=`Scanned ${scans.length}/${paths.length}: ${path}`}busy=false;$('#status').textContent='Full scan complete — inspect flagged pages visually.'};
$('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({source:'ebac159b85ffc697bc29872817f9235671ce180a',sizes,scans},null,2)],{type:'application/json'}));a.download='zapla-responsive-audit-20261028.json';a.click();URL.revokeObjectURL(a.href)};
layout();load('/features/ai-chatbot');
</script>
</html>
