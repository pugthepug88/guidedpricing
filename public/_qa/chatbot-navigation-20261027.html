<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Temporary navigation review</title>
    <style>
      body {
        margin: 0;
        background: #ddd;
        font: 14px system-ui;
      }
      nav {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 12px;
      }
      button {
        padding: 8px;
      }
      iframe {
        display: block;
        margin: auto;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Review viewport">
      <button data-width="320">Narrow 320</button>
      <button data-width="393">Phone 393</button>
      <button data-width="834">Tablet 834</button>
      <button id="top">Show header</button>
      <button id="footer">Show feature links</button>
    </nav>
    <iframe title="Navigation preview" src="/features/ai-chatbot" width="393" height="820"></iframe>
    <script>
      const frame = document.querySelector("iframe");
      document.querySelectorAll("[data-width]").forEach((button) =>
        button.addEventListener("click", () => {
          frame.width = button.dataset.width;
        }),
      );
      document
        .querySelector("#top")
        .addEventListener("click", () => frame.contentWindow.scrollTo(0, 0));
      document.querySelector("#footer").addEventListener("click", () => {
        frame.contentDocument.querySelector("footer nav").scrollIntoView({ block: "center" });
      });
    </script>
  </body>
</html>
