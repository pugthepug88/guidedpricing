<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporary Business Phone hero review</title><style>body{margin:0;background:#e7e9ed;font:14px system-ui;color:#111318}header{padding:12px 20px;background:white;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:2}select,button{font:inherit;padding:8px}main{padding:16px;display:flex;justify-content:center}iframe{display:block;width:1280px;max-width:none;height:1500px;border:1px solid #aeb6c3;background:white;flex-shrink:0}</style></head><body><header><strong>Hero layout review</strong><label>Width <select id="width"><option value="1280">Desktop 1280</option><option value="1024">Tablet 1024</option><option value="834">Tablet 834</option><option value="390">Phone 390</option><option value="320">Phone 320</option></select></label><button id="start">Hero top</button><button id="card">Calling scene</button><button id="power">Power Dialler</button><output id="result"></output></header><main><iframe id="preview" title="Business Phone responsive preview" src="/features/business-phone"></iframe></main><script>const frame=document.getElementById('preview');const widths=document.getElementById('width');const result=document.getElementById('result');function report(){const d=frame.contentDocument;if(d)result.textContent='Viewport '+d.documentElement.clientWidth+' / document '+d.documentElement.scrollWidth;}widths.addEventListener('change',()=>{frame.style.width=widths.value+'px';requestAnimationFrame(()=>requestAnimationFrame(report));});frame.addEventListener('load',report);document.getElementById('start').onclick=()=>{frame.contentWindow.scrollTo(0,0);report();};document.getElementById('card').onclick=()=>{const el=frame.contentDocument.querySelector('.bp-photo-call');frame.contentWindow.scrollTo(0,el.offsetTop-65);report();};document.getElementById('power').onclick=()=>{const el=frame.contentDocument.getElementById('power-dialler');frame.contentWindow.scrollTo(0,el.offsetTop-80);report();};</script></body></html>
