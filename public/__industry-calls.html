<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Industry call workflow QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{display:flex;gap:8px;padding:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:#ddd}select,button{padding:6px}#stage{margin:auto;overflow:visible}iframe{border:0;display:block;transform-origin:top left;background:#fcfcfa}</style><header><label>Industry <select id="industry" onchange="changeIndustry()"><option value="cosmetic-skin-clinics">Skin</option><option value="dental">Dental</option><option value="mechanics">Mechanics</option><option value="allied-health">Allied health</option><option value="trades">Trades</option><option value="mortgage-brokers-v2">Mortgage comparison</option><option value="mortgage-brokers">Mortgage original</option></select></label><label>Width <select id="width" onchange="applySize()"><option>1348</option><option>1024</option><option>768</option><option>390</option><option>320</option></select></label><button onclick="applySize()">Full size</button><button onclick="whole()">Whole page</button></header><div id="stage"><iframe id="frame" title="Industry page" src="/industries/cosmetic-skin-clinics"></iframe></div><script>const frame=document.querySelector('#frame'),stage=document.querySelector('#stage'),widthControl=document.querySelector('#width'),industryControl=document.querySelector('#industry');function setSize(h,scale){frame.style.width=widthControl.value+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=widthControl.value*scale+'px';stage.style.height=h*scale+'px'}function applySize(){setSize(850,1)}function whole(){let h=frame.contentDocument.documentElement.scrollHeight;setSize(h,Math.min(1,800/h))}function changeIndustry(){frame.src='/industries/'+industryControl.value}applySize()</script></html>
