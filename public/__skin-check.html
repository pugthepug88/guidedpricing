<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Clinic page QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:#ddd}button,select{padding:6px}#stage{margin:auto;overflow:visible}iframe{border:0;display:block;transform-origin:top left;background:#fcfcfa}</style><header><label>Width <select id="width" onchange="size()"><option>1348</option><option>1024</option><option>768</option><option>390</option><option>320</option></select></label><button onclick="whole()">Whole page</button><button onclick="size()">Full size</button><button onclick="frame.src='/industries/dental'">Dental</button><button onclick="frame.src='/industries/cosmetic-skin-clinics'">Skin</button></header><div id="stage"><iframe id="frame" title="Page under review" src="/industries/cosmetic-skin-clinics"></iframe></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),width=document.querySelector('#width');function set(w,h,s){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+s+')';stage.style.width=w*s+'px';stage.style.height=h*s+'px'}function size(){set(+width.value,850,1)}function whole(){let h=frame.contentDocument.documentElement.scrollHeight;set(+width.value,h,Math.min(1,800/h))}size()</script></html>
