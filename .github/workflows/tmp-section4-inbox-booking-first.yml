name: Temp Section 4 Inbox Booking First
on:
  push:
    branches:
      - section4-inbox-booking-first
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
