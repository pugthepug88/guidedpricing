name: Section 9 Render QA
on:
  push:
    branches: [qa-section9-render]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install >/dev/null 2>&1
      - run: npm install --no-save playwright@1.55.0 >/dev/null 2>&1
      - run: npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/concept/cinematic-follow-through-v6 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Capture Section 9
        run: |
          mkdir -p section9-shots
          cat > qa-section9.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1682,height:1224}});
          await page.goto('http://127.0.0.1:8080/concept/cinematic-follow-through-v6', {waitUntil:'networkidle'});
          await page.evaluate(() => document.fonts.ready);
          const info = await page.evaluate(() => {
            const card=document.querySelector('[data-result-card="broker"]');
            const sec=card?.closest('section');
            if(!sec)return null;
            const r=sec.getBoundingClientRect();
            return {top:r.top+scrollY,height:r.height};
          });
          if(!info) throw new Error('Section 9 not found');
          const checkpoints=[0,0.10,0.20,0.34,0.46,0.60,0.74,0.86,0.96];
          for(const p of checkpoints){
            const viewportHeight=await page.evaluate(()=>innerHeight);
            const y=info.top+p*(info.height-viewportHeight);
            await page.evaluate(y=>{document.documentElement.style.scrollBehavior='auto';scrollTo(0,y)},y);
            await page.waitForTimeout(450);
            const actual=await page.evaluate(({top,height})=>({scrollY,progress:(scrollY-top)/(height-innerHeight)}),info);
            console.log(`SHOT ${p.toFixed(2)} actual=${actual.progress.toFixed(3)} scrollY=${actual.scrollY.toFixed(1)}`);
            await page.screenshot({path:`section9-shots/p${String(Math.round(p*100)).padStart(2,'0')}.png`,fullPage:false});
          }
          await browser.close();
          EOF
          node qa-section9.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: section9-shots
          path: section9-shots/*.png
          retention-days: 1