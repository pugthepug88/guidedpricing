name: Section 9 Render QA
on:
  push:
    branches: [qa-section9-render]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install >/dev/null 2>&1
      - run: npm install --no-save playwright@1.55.0 >/dev/null 2>&1
      - run: npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/concept/cinematic-follow-through-v6 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Measure Section 9 across scroll
        run: |
          cat > qa-section9.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900}});
          await page.goto('http://127.0.0.1:8080/concept/cinematic-follow-through-v6', {waitUntil:'networkidle'});
          await page.evaluate(() => document.fonts.ready);
          const info = await page.evaluate(() => {
            const card = document.querySelector('[data-result-card="broker"]');
            const sec = card?.closest('section');
            if (!sec) return null;
            const r = sec.getBoundingClientRect();
            return {top:r.top+scrollY, height:r.height};
          });
          if (!info) throw new Error('Section 9 not found');
          const ids = ['broker','follow-up','active','system','why','summary'];
          const points = Array.from({length:51},(_,i)=>i/50);
          const out=[];
          for (const p of points) {
            const y = info.top + p * Math.max(0, info.height - 900);
            await page.evaluate(y => scrollTo(0,y), y);
            await page.waitForTimeout(80);
            const sample = await page.evaluate((ids,p) => {
              const vp={w:innerWidth,h:innerHeight};
              const rows = ids.map(id => {
                const el=document.querySelector(`[data-result-card="${id}"]`);
                if(!el) return {id,missing:true};
                const r=el.getBoundingClientRect();
                const wrap=el.parentElement;
                const op=wrap?parseFloat(getComputedStyle(wrap).opacity||'1'):1;
                const iw=Math.max(0, Math.min(r.right,vp.w)-Math.max(r.left,0));
                const ih=Math.max(0, Math.min(r.bottom,vp.h)-Math.max(r.top,0));
                const area=Math.max(1,r.width*r.height);
                return {id,x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),right:+r.right.toFixed(1),bottom:+r.bottom.toFixed(1),opacity:+op.toFixed(3),visible:+((iw*ih)/area).toFixed(3)};
              });
              const title=[...document.querySelectorAll('h2')].find(h=>h.textContent?.includes('From the first'));
              let titleData=null;
              if(title){const r=title.getBoundingClientRect(); const wrap=title.parentElement; titleData={y:+r.y.toFixed(1),h:+r.height.toFixed(1),opacity:+parseFloat(getComputedStyle(wrap).opacity||'1').toFixed(3)};}
              const visible=rows.filter(x=>!x.missing && x.opacity>.05 && x.visible>.02);
              return {p:+p.toFixed(2),title:titleData,cards:rows,meaningfulVisible:visible.map(x=>x.id)};
            }, ids, p);
            out.push(sample);
          }
          const target={
            broker:{x:231,y:304,w:950,h:591},
            'follow-up':{x:279,y:184,w:706,h:591},
            system:{x:322,y:115,w:956,h:586},
            why:{x:518,y:89,w:706,h:581},
            summary:{x:227,y:44,w:950,h:591}
          };
          const focus={};
          for(const id of Object.keys(target)){
            const t=target[id]; let best=null;
            for(const s of out){const c=s.cards.find(v=>v.id===id); if(!c||c.opacity<.2)continue; const e=Math.abs(c.x-t.x)+Math.abs(c.y-t.y)+Math.abs(c.w-t.w)+Math.abs(c.h-t.h); if(!best||e<best.error)best={p:s.p,error:+e.toFixed(1),box:c};}
            focus[id]=best;
          }
          const summary=out.map(s=>({p:s.p,visible:s.meaningfulVisible,boxes:Object.fromEntries(s.cards.filter(c=>c.opacity>.05&&c.visible>.02).map(c=>[c.id,{x:c.x,y:c.y,w:c.w,h:c.h,vis:c.visible,op:c.opacity}]))}));
          console.log('SECTION9_QA_JSON_START');
          console.log(JSON.stringify({section:info,target,focus,samples:summary},null,2));
          console.log('SECTION9_QA_JSON_END');
          await browser.close();
          EOF
          node qa-section9.mjs