name: Install Higgsfield dependency

on:
  push:
    branches:
      - higgsfield-seedance-2-5
    paths:
      - .github/workflows/install-higgsfield.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: higgsfield-seedance-2-5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install official Higgsfield SDK
        run: bun add @higgsfield/client@^0.2.6

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "Dependency files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Install Higgsfield SDK"
          git push
