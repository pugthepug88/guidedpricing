name: Validate Higgsfield Seedance

on:
  push:
    branches:
      - higgsfield-seedance-2-5
    paths:
      - .github/workflows/validate-higgsfield.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prepare local Higgsfield credentials
        env:
          HF_CREDENTIALS: ${{ secrets.HF_CREDENTIALS }}
        run: |
          if [ -z "$HF_CREDENTIALS" ]; then
            echo "::error::HF_CREDENTIALS is not configured as a GitHub Actions secret. Billable Seedance verification cannot run."
            exit 1
          fi
          umask 077
          printf 'HF_CREDENTIALS=%s\n' "$HF_CREDENTIALS" > .env.local

      - name: Run billable Seedance verification
        run: bun run higgsfield:seedance
