name: Temp Section 4 Capture Avatar Polish
on:
  push:
    branches:
      - section4-v6-polish-capture-avatar-slot
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
