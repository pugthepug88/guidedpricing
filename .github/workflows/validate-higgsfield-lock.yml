name: Validate Higgsfield lock

on:
  push:
    branches:
      - higgsfield-seedance-2-5
    paths:
      - .github/workflows/validate-higgsfield-lock.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build project
        run: bun run build
      - name: Verify missing-credential guard
        run: |
          set +e
          output="$(bun run higgsfield:seedance 2>&1)"
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "::error::Seedance example unexpectedly succeeded without credentials."
            exit 1
          fi
          echo "$output" | grep -q "HF_CREDENTIALS is not set"
